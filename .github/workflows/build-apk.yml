name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set App Icon & Build APK
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/dailyfit-512.png android/app/src/main/res/mipmap-$dir/ic_launcher.png
            cp public/dailyfit-512.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DailyFit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
