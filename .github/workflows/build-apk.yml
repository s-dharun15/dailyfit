name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Build Next.js App
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_YWmmujREvQOHtrmWpIhDmQ_waW0eRDb
        run: |
          npm run build
          mv out/_next out/next_assets
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|/_next/|/next_assets/|g' {} +
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set App Icon & Build APK
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/dailyfit-512.png android/app/src/main/res/mipmap-$dir/ic_launcher.png
            cp public/dailyfit-512.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DailyFit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
